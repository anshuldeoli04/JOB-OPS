name: Source Health Check

on:
  schedule:
    # Run once daily at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      sources:
        description: 'Sources to probe (comma-separated or "all")'
        required: false
        default: 'greenhouse,lever,ashby'

jobs:
  verify:
    name: Probe ATS & Source Health
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify ATS Endpoints & Slugs
        run: node scanner.mjs --verify-sources

      - name: Upload Health Verification Artifact
        uses: actions/upload-artifact@v7
        with:
          name: verify-sources
          path: data/verify-sources.json
          if-no-files-found: ignore
